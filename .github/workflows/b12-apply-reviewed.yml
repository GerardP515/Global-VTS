name: Apply reviewed B12 update
on:
  push:
    branches: ['review/b12-20260930']
    paths: ['.github/workflows/b12-apply-reviewed.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/b12-20260930
      - name: Verify and restore reviewed text files
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, zlib
          folder=pathlib.Path('research/stage2/b12_recheck_transport')
          names=['part1.txt','chunk10000.txt','chunk14000.txt','chunk18000.txt','chunk22000.txt']
          packed=base64.b64decode(''.join((folder/name).read_text().strip() for name in names),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='70c530e44b0e526d025fdffb7bfb06d600e97dea1af5a149e7e2d6f53d4725ca'
          files=json.loads(zlib.decompress(packed).decode('utf-8'))
          assert len(files)==11
          allowed={'audits/stage2/B12_Recheck_20260930.md','scripts/apply_b12_recheck_20260930.py','tests/test_b12_recheck.py'}
          for name,content in files.items():
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert name in allowed or name.startswith('research/stage2/b12_recheck_20260930/')
              assert isinstance(content,str)
              target=pathlib.Path(name);target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(content,encoding='utf-8')
          print('Restored 11 checksum-verified review files.')
          PY
      - name: Apply scoped row-hash-guarded update
        run: python3 scripts/apply_b12_recheck_20260930.py
      - name: Validate all registers and regression tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/b12-reviewed
          python3 scripts/validate_registers.py | tee /tmp/b12-reviewed/validation.json
          python3 -m unittest discover -s tests -v 2>&1 | tee /tmp/b12-reviewed/test_results.txt
      - name: Commit only B12 and its synchronised register views
        run: |
          git rm -r research/stage2/b12_recheck_transport
          git rm .github/workflows/b12-source-check.yml .github/workflows/b12-apply-reviewed.yml
          git add audits/stage2/B12_Recheck_20260930.md audits/stage2/B12_Association_Audit.md
          git add research/stage2/b12_recheck_20260930 scripts/apply_b12_recheck_20260930.py tests/test_b12_recheck.py
          git add data/current/Batch_Status.csv data/current/Guide_Service_Candidates.csv data/current/Research_Gaps.csv
          git add data/current/TSS_Service_Relationships.csv data/current/TSS_VTS_MRS_Association_Register.csv data/current/VTS_Entity_Register.csv
          git add research/batches_imo2025/B12.md research/batches_imo2025/README.md sources/SOURCE_REGISTER.csv sources/SOURCE_REGISTER.md
          python3 - <<'PY'
          import json,pathlib,subprocess
          changed=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          allowed={'audits/stage2/B12_Recheck_20260930.md','audits/stage2/B12_Association_Audit.md','scripts/apply_b12_recheck_20260930.py','tests/test_b12_recheck.py','data/current/Batch_Status.csv','data/current/Guide_Service_Candidates.csv','data/current/Research_Gaps.csv','data/current/TSS_Service_Relationships.csv','data/current/TSS_VTS_MRS_Association_Register.csv','data/current/VTS_Entity_Register.csv','research/batches_imo2025/B12.md','research/batches_imo2025/README.md','sources/SOURCE_REGISTER.csv','sources/SOURCE_REGISTER.md','.github/workflows/b12-source-check.yml','.github/workflows/b12-apply-reviewed.yml'}
          for name in filter(None,changed):
              assert name in allowed or name.startswith('research/stage2/b12_recheck_20260930/') or name.startswith('research/stage2/b12_recheck_transport/'),name
          info=json.loads(pathlib.Path('research/stage2/b12_recheck_20260930/application_checks.json').read_text())
          assert info['unchanged_other_tss_rows']==219 and info['unchanged_b20_b29_rows']==50
          assert info['positive_vts_associations']==3 and info['unresolved_vts_associations']==2
          print(json.dumps(info,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'B12 recheck: confirm partial Off Texel VTS associations; retain IJmuiden gaps'
          git push origin HEAD:refs/heads/review/b12-20260930
          git rev-parse HEAD > /tmp/b12-reviewed/commit.txt
          cp audits/stage2/B12_Recheck_20260930.md /tmp/b12-reviewed/
          cp research/stage2/b12_recheck_20260930/B12_Association_Rows.csv /tmp/b12-reviewed/
          cp research/stage2/b12_recheck_20260930/application_checks.json /tmp/b12-reviewed/
          cp research/stage2/b12_recheck_20260930/geometry_checks.json /tmp/b12-reviewed/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b12-reviewed-results
          path: /tmp/b12-reviewed/
          retention-days: 14

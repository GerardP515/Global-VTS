name: One-time register repair

on:
  push:
    paths:
      - '.github/workflows/repair-registers-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore locally tested repair tools
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, zlib
          parts = [pathlib.Path(f'scripts/review_transfer_part{i}.txt').read_text().strip() for i in (1,2,3)]
          raw = zlib.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '8813fc81618649f9f2e5863b5576512b4a3ab1be54ba57ef2f1eddf3f60620bc', 'Transfer integrity failure'
          files = json.loads(raw)
          allowed = {'scripts/repair_registers_20260930.py', 'scripts/validate_registers.py', 'tests/test_register_validation.py'}
          assert set(files) == allowed
          for name, content in files.items():
              p = pathlib.Path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding='utf-8')
          PY
      - name: Apply guarded repair
        run: python3 scripts/repair_registers_20260930.py
      - name: Validate all registers and regression tests
        shell: bash
        run: |
          mkdir -p /tmp/global-vts-fixed
          python3 scripts/validate_registers.py | tee /tmp/global-vts-fixed/validation.json
          python3 -m unittest discover -s tests -v 2>&1 | tee /tmp/global-vts-fixed/tests.txt
      - name: Commit validated changes without rewriting history
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess
          paths = json.load(open('audits/repository_review_20260930/changed_paths.json'))
          paths += ['scripts/repair_registers_20260930.py','scripts/validate_registers.py','tests/test_register_validation.py']
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','rm','--','scripts/review_transfer_part1.txt','scripts/review_transfer_part2.txt','scripts/review_transfer_part3.txt','.github/workflows/repair-registers-once.yml'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair Global VTS registers, integrate 224 TSS and reopen evidence gaps'
          git push origin HEAD:main
      - name: Collect reproducible review outputs
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/global-vts-fixed
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, zipfile
          root=pathlib.Path('.')
          selected=[]
          for folder in ['data/current','data/authoritative','sources','audits/repository_review_20260930','scripts','tests','.github/workflows']:
              selected.extend(p for p in (root/folder).rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix not in {'.xlsx','.pyc'})
          selected.extend([root/'README.md',root/'docs/STAGE_2_COUNTING_AND_COMPLETION.md'])
          selected.extend(p for p in (root/'research/batches_imo2025').glob('*.md'))
          selected=[p for p in selected if p.exists()]
          with zipfile.ZipFile('/tmp/global-vts-fixed/Global_VTS_Reviewed_Register_Pack.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in selected:z.write(p,p.as_posix())
          manifest={p.as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in selected}
          pathlib.Path('/tmp/global-vts-fixed/file_sha256.json').write_text(json.dumps(manifest,indent=2))
          pathlib.Path('/tmp/global-vts-fixed/commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD']).decode())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-vts-fixed-registers
          path: /tmp/global-vts-fixed/
          retention-days: 14

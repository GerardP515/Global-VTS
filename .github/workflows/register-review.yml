name: Register validation

on:
  push:
    paths:
      - 'data/current/**'
      - 'data/authoritative/**'
      - 'sources/**'
      - 'research/batches_imo2025/**'
      - 'scripts/validate_registers.py'
      - 'tests/**'
      - '.github/workflows/register-review.yml'
  pull_request:
    paths:
      - 'data/current/**'
      - 'data/authoritative/**'
      - 'sources/**'
      - 'research/batches_imo2025/**'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate current registers and regression tests
        run: |
          python3 scripts/validate_registers.py
          python3 -m unittest discover -s tests -v

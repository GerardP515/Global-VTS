name: B12 source check
on:
  push:
    branches: ['review/b12-20260930']
    paths: ['.github/workflows/b12-source-check.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Collect public authority sources and repository text
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, html, json, pathlib, re, subprocess, urllib.parse, urllib.request, zipfile
          out = pathlib.Path('/tmp/b12-source-check'); out.mkdir()
          targets = {
            'ijmuiden_2025.pdf':'https://www.portofamsterdam.com/sites/default/files/2025-09/2025-479_VTS%20communicatieregeling%202.0%20def_NLEN_rev.pdf',
            'baz_week41_2025.html':'https://www.defensie.nl/onderwerpen/b/berichten-aan-zeevarenden/weekedities/2025/41',
            'ukho_week44_2025.pdf':'https://msi.admiralty.co.uk/NoticesToMariners/DownloadFile?batchId=fbeae6b4-4204-4a74-bf85-b699fa8be8b5&fileName=44wknm25.pdf&frequency=Weekly&mimeType=application%2Fpdf',
            'rws_off_texel.html':'https://www.rijkswaterstaat.nl/nieuws/archief/2025/10/nieuw-vts-gebied-off-texel-vanaf-3-november-operationeel',
            'rws_collections.json':'https://geo.rijkswaterstaat.nl/services/ogc/gdr/fis_vnds/ogc/features/v1/collections?f=json',
            'stz.html':'https://wetten.overheid.nl/BWBR0007914/2026-09-30',
            'communications.html':'https://wetten.overheid.nl/BWBR0031567/2026-09-30',
          }
          def fetch(pair):
            name,url=pair
            try:
              req=urllib.request.Request(url, headers={'User-Agent':'Global-VTS source verification/1.0'})
              with urllib.request.urlopen(req, timeout=25) as response:
                data=response.read(20_000_000); final=response.url; typ=response.headers.get('Content-Type','')
              (out/name).write_bytes(data)
              return {'file':name,'url':url,'resolved_url':final,'content_type':typ,'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}
            except Exception as exc:
              return {'file':name,'url':url,'error':str(exc)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
            results=list(pool.map(fetch,targets.items()))
          page=out/'baz_week41_2025.html'
          if page.exists():
            urls=[]
            for value in re.findall(r'href=[\"\x27]([^\"\x27]+)',page.read_text(errors='replace')):
              url=urllib.parse.urljoin(targets[page.name],html.unescape(value))
              if urllib.parse.urlparse(url).hostname in {'www.defensie.nl','english.defensie.nl'} and ('.pdf' in url.lower() or '/downloads/' in url) and ('2025' in url or '41' in url): urls.append(url)
            for i,url in enumerate(dict.fromkeys(urls)):
              if i>=8: break
              results.append(fetch((f'baz_attachment_{i}.pdf',url)))
          (out/'fetch_results.json').write_text(json.dumps(results,indent=2))
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile(out/'repository-text.zip','w',zipfile.ZIP_DEFLATED) as z:
            for name in names:
              p=pathlib.Path(name)
              if name and p.suffix.lower() in {'.md','.json','.csv','.py','.yml','.yaml','.txt'}: z.write(p,name)
          (out/'commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD']).decode())
          print(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b12-source-check
          path: /tmp/b12-source-check/
          retention-days: 7

name: B12 source check
on:
  push:
    branches: ['review/b12-20260930']
    paths: ['.github/workflows/b12-source-check.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Collect public VTS sector geometries
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, urllib.parse, urllib.request
          out=pathlib.Path('/tmp/b12-source-check');out.mkdir()
          base='https://geo.rijkswaterstaat.nl/services/ogc/gdr/fis_vnds/ogc/features/v1/collections/'
          targets={x+'.json':base+x+'/items?f=application%2Fgeo%2Bjson&limit=1000' for x in ['vts_deelsector','vts_deelsector_v','vts_centrales']}
          targets['port_communication.html']='https://www.portofamsterdam.com/en/shipping/sea-shipping/nautical-information/communication'
          targets['national_vhf.html']='https://www.portofamsterdam.com/en/shipping/sea-shipping/nautical-information'
          def fetch(pair):
            name,url=pair
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Global-VTS research/1.0'}),timeout=30) as r:
                data=r.read(20_000_000);final=r.url;typ=r.headers.get('Content-Type','')
              (out/name).write_bytes(data)
              return {'file':name,'url':url,'resolved_url':final,'content_type':typ,'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}
            except Exception as exc:return {'file':name,'url':url,'error':str(exc)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:results=list(pool.map(fetch,targets.items()))
          (out/'fetch_results.json').write_text(json.dumps(results,indent=2));print(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b12-sector-data
          path: /tmp/b12-source-check/
          retention-days: 7
